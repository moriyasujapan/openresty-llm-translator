worker_processes 2;
user build;
pid nginx-translator.pid;
error_log logs/error.log warn;

events { worker_connections 256; }

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    access_log logs/access.log;

    lua_package_path "/home/build/ai/nginx-translator/lua/?.lua;;";

    lua_shared_dict translate_cache 64m;

    init_worker_by_lua_block {
        require("filter").init_worker()
    }

    # ---- demo upstream (静的) ----
    server {
        listen 127.0.0.1:8090;
        server_name demo;
        location / {
            root /home/build/ai/nginx-translator/demo;
            default_type text/html;
        }
    }

    # ---- translator gateway ----
    server {
        listen 127.0.0.1:8080;
        server_name gateway;

        location = /_translator/cache/flush {
            content_by_lua_block {
                require("filter").flush_cache()
            }
        }

        location = /_translator/cache/dump {
            content_by_lua_block {
                require("filter").dump_cache()
            }
        }

        location / {
            content_by_lua_block {
                require("filter").handle()
            }
        }

        location @up {
            internal;
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host "demo-upstream";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # capture()からたどれるinternal location (ngx.location.captureは
        # named locationにdirectにinternal redirectできないため)
        location ^~ /__upstream/ {
            internal;
            rewrite ^/__upstream(/.*) $1 break;
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host "demo-upstream";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
