worker_processes 1;
pid t_live.pid;
error_log logs/t_error.log warn;

events { worker_connections 64; }

http {
    access_log logs/t_access.log;
    lua_package_path "/home/build/ai/nginx-translator/lua/?.lua;;";
    lua_shared_dict translate_cache 10m;

    server {
        listen 127.0.0.1:8099;

        location /run {
            content_by_lua_block {
                local body = dofile("/home/build/ai/nginx-translator/t/translate_body.lua")
                local ok, out = body()
                ngx.header.content_type = "text/plain"
                ngx.say(out)
                if not ok then ngx.status = 400 end
            }
        }
    }
}
