worker_processes 1;
pid dbg.pid;
error_log logs/dbg_error.log warn;
events { worker_connections 32; }
http {
    access_log logs/dbg_access.log;
    server {
        listen 127.0.0.1:8098;
        location /dbg/ {
            content_by_lua_block {
                local res = ngx.location.capture("/__upstream/", { method = ngx.HTTP_GET })
                local keys = {}
                for k, v in pairs(res) do keys[#keys+1] = k .. "=" .. type(v) end
                table.sort(keys)
                ngx.say("keys: ", table.concat(keys, ", "))
                ngx.say("status: ", res.status)
                if res.header then
                    for k, v in pairs(res.header) do ngx.say("H ", k, ": ", tostring(v)) end
                else
                    ngx.say("no res.header")
                end
            }
        }
        location ^~ /__upstream/ {
            internal;
            rewrite ^/__upstream(/.*) $1 break;
            proxy_pass http://127.0.0.1:8090;
        }
    }
}
